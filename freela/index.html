<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freela · Felipe Reis</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0A0D10" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0A0D10; --surface: #13171B; --surface-2: #191E23; --surface-3: #20262c;
      --text: #ECEDEA; --muted: #8890A0; --border: rgba(255,255,255,.1);
      --orange: #FF6B3D; --teal: #17B3A3; --violet: #7C6CF0; --red: #FF5A5F; --yellow: #F5B83D;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; min-width: 0; }
    body { background: var(--bg); color: var(--text); font: 15px/1.5 'Inter', system-ui, sans-serif; }
    button, input, select, textarea { font: inherit; color: inherit; }
    .app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }

    nav { background: var(--surface); border-right: 1px solid var(--border); padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
    .logo { font: 900 30px/1 'Big Shoulders Display', sans-serif; letter-spacing: .5px; margin: 0 8px 22px; display: flex; align-items: center; gap: 8px; }
    .logo i { width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
    .logo span { color: var(--orange); }
    nav button { background: none; border: 0; text-align: left; padding: 10px 12px; border-radius: 8px; color: var(--muted); cursor: pointer; font-weight: 500; display: flex; justify-content: space-between; }
    nav button:hover { background: var(--surface-2); color: var(--text); }
    nav button.on { background: var(--surface-3); color: var(--text); }
    nav button b { font-weight: 600; font-size: 12px; background: var(--surface-3); color: var(--muted); border-radius: 10px; padding: 1px 8px; }
    nav button b:empty { display: none; }
    nav .spacer { flex: 1; }
    nav .small { font-size: 13px; padding: 8px 12px; }

    main { padding: 28px 32px 60px; max-width: 1200px; width: 100%; }
    .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
    h1 { font: 900 40px/1 'Big Shoulders Display', sans-serif; text-transform: uppercase; }
    .sub { color: var(--muted); margin-top: 6px; }
    .btn { background: var(--orange); color: #0A0D10; border: 0; border-radius: 9px; padding: 10px 16px; font-weight: 700; cursor: pointer; }
    .btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); font-weight: 600; }
    .btn.sm { padding: 6px 10px; font-size: 13px; }
    .btn:focus-visible, nav button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

    .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 22px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
    .card small { color: var(--muted); font-size: 13px; }
    .card strong { display: block; font: 900 32px/1.1 'Big Shoulders Display', sans-serif; margin-top: 4px; }
    .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
    .panel h2 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
    .empty { color: var(--muted); font-size: 14px; padding: 10px 0; }

    .toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .toolbar input, .toolbar select { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
    .toolbar input { flex: 1; min-width: 200px; }

    table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
    td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    tr.click { cursor: pointer; }
    tr.click:hover td { background: var(--surface-2); }
    td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .muted { color: var(--muted); }
    .late { color: var(--red); font-weight: 600; }

    .tag { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 20px; padding: 2px 10px; white-space: nowrap; }
    .t-orcamento, .t-enviado, .t-pendente { background: rgba(136,144,160,.18); color: #b9c0cc; }
    .t-aprovado, .t-respondeu { background: rgba(124,108,240,.2); color: #b3a9ff; }
    .t-edicao, .t-negociando { background: rgba(245,184,61,.18); color: var(--yellow); }
    .t-revisao { background: rgba(255,107,61,.18); color: var(--orange); }
    .t-entregue, .t-fechou, .t-pago { background: rgba(23,179,163,.2); color: var(--teal); }
    .t-cancelado, .t-perdido { background: rgba(255,90,95,.15); color: var(--red); }

    .list li { list-style: none; display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 14px; }
    .list li:last-child { border: 0; }

    .funnel { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .funnel button { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; cursor: pointer; color: var(--muted); }
    .funnel button b { color: var(--text); font-size: 18px; margin-right: 6px; }
    .funnel button.on { border-color: var(--orange); color: var(--text); }

    .cal-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .cal-head strong { font: 900 26px/1 'Big Shoulders Display', sans-serif; text-transform: uppercase; min-width: 220px; }
    .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .cal .dow { background: var(--surface-2); padding: 8px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .cal .day { background: var(--surface); min-height: 104px; padding: 6px; border-top: 1px solid var(--border); border-left: 1px solid var(--border); font-size: 12px; }
    .cal .day:nth-child(7n+1) { border-left: 0; }
    .cal .day.out { background: #0f1316; color: #4b525c; }
    .cal .day.today .n { background: var(--orange); color: #0A0D10; border-radius: 50%; }
    .cal .n { display: inline-grid; place-items: center; width: 22px; height: 22px; font-weight: 600; margin-bottom: 4px; }
    .ev { display: block; border-radius: 4px; padding: 2px 5px; margin-bottom: 3px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; border: 0; width: 100%; text-align: left; font-size: 11px; }
    .ev.p { background: rgba(255,107,61,.22); color: #ffb39a; }
    .ev.m { background: rgba(23,179,163,.22); color: #7fe0d5; }

    dialog { margin: auto; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--text); width: min(560px, calc(100vw - 32px)); padding: 0; }
    dialog::backdrop { background: rgba(0,0,0,.6); }
    dialog form { padding: 22px; }
    dialog h3 { font: 900 26px/1 'Big Shoulders Display', sans-serif; text-transform: uppercase; margin-bottom: 14px; }
    .fields { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px 12px; }
    .fields .full { grid-column: 1 / -1; }
    .fields label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
    .fields input, .fields select, .fields textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; }
    .fields textarea { min-height: 70px; resize: vertical; }
    .fields input:focus, .fields select:focus, .fields textarea:focus { outline: 2px solid var(--orange); outline-offset: 0; }
    .actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
    .actions .right { display: flex; gap: 10px; margin-left: auto; }
    .del { background: none; border: 0; color: var(--red); cursor: pointer; font-weight: 600; }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--surface-3); border: 1px solid var(--border); padding: 10px 18px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }

    @media (max-width: 860px) {
      .app { grid-template-columns: minmax(0,1fr); }
      nav { position: sticky; top: 0; height: auto; flex-direction: row; overflow-x: auto; padding: 10px; z-index: 3; }
      .logo { display: none; } nav .spacer, nav .small { display: none; }
      main { padding: 20px 16px 50px; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid2 { grid-template-columns: minmax(0,1fr); }
      table { display: block; overflow-x: auto; }
      .cal .day { min-height: 70px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <nav>
      <div class="logo"><i></i>freela<span>.</span></div>
      <button data-v="painel">Painel</button>
      <button data-v="projetos">Projetos <b id="c-projetos"></b></button>
      <button data-v="clientes">Clientes <b id="c-clientes"></b></button>
      <button data-v="financeiro">Financeiro</button>
      <button data-v="prospeccao">Prospecção <b id="c-leads"></b></button>
      <button data-v="calendario">Calendário</button>
      <div class="spacer"></div>
      <button class="small" id="exportar">Salvar backup</button>
      <button class="small" id="importar">Importar arquivo</button>
      <input type="file" id="arquivo" accept="application/json" hidden />
    </nav>
    <main id="main"></main>
  </div>

  <dialog id="dlg"><form id="frm" method="dialog"></form></dialog>
  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
